<script>
/* ================================================ חשבונות וסנכרון ענן ==
   פעיל רק כשקובץ config.js מכיל כתובת Supabase ומפתח anon.
   בלעדיו האפליקציה עובדת בדיוק כמו קודם — הכול מקומי.
   ===================================================================== */
const CFG = window.KOCHAVOT_CONFIG || {};
const CLOUD_READY = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient);
let sb = null, cloudUser = null, pushTimer = null, cloudBusy = false, authTab = "in", authErr = "";

const emailFor = u => String(u || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "") + "@kochavot.app";

function cloudInit() {
  if (!CLOUD_READY) return null;
  if (!sb) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  return sb;
}
function localPayload() {
  const copy = JSON.parse(JSON.stringify({ rev: S.rev || 0, pin: S.pin, sound: S.sound, profiles: S.profiles, rivals: S.rivals || [] }));
  copy.profiles.forEach(p => { p.log = (p.log || []).slice(-150); });
  return copy;
}
async function cloudPull() {
  if (!sb || !cloudUser) return null;
  const { data, error } = await sb.from("saves").select("data").eq("user_id", cloudUser.id).maybeSingle();
  if (error || !data || !data.data) return null;
  return data.data;
}
async function cloudPush() {
  if (!sb || !cloudUser || cloudBusy) return;
  cloudBusy = true;
  try {
    S.rev = (S.rev || 0) + 1;
    await sb.from("saves").upsert({ user_id: cloudUser.id, data: localPayload(), updated_at: new Date().toISOString() });
  } catch (e) {} finally { cloudBusy = false; }
}
function schedulePush() {
  if (!sb || !cloudUser) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudPush, 1500);
}
function adoptCloud(remote) {
  S.profiles = remote.profiles || [];
  S.rivals = remote.rivals || [];
  if (remote.pin) S.pin = remote.pin;
  if (typeof remote.sound === "boolean") S.sound = remote.sound;
  S.rev = remote.rev || 0;
  S.cur = null;
  S.profiles.forEach(p => { try { upgrade(p); } catch (e) {} });
  persistLocal();
}
async function afterLogin() {
  const remote = await cloudPull();
  if (remote && Array.isArray(remote.profiles) && (remote.rev || 0) >= (S.rev || 0)) adoptCloud(remote);
  else await cloudPush();
  S.uid = cloudUser.id;
  persistLocal();
  newp = S.profiles.length ? null : { name: "", avatar: "luna", grade: 2 };
  go("pick");
}
async function doAuth(mode, u, pw) {
  authErr = "";
  if (!u || u.trim().length < 2) { authErr = "צריך שם משתמש (לפחות 2 תווים)"; return render(); }
  if (!pw || pw.length < 6) { authErr = "הסיסמה צריכה להיות לפחות 6 תווים"; return render(); }
  cloudInit();
  const email = emailFor(u), opts = { email, password: pw };
  let res;
  try {
    res = mode === "up" ? await sb.auth.signUp(opts) : await sb.auth.signInWithPassword(opts);
  } catch (e) { authErr = "אין חיבור לשרת כרגע"; return render(); }
  if (res.error) {
    const m = String(res.error.message || "");
    authErr = /already registered|User already/i.test(m) ? "שם המשתמש הזה כבר תפוס"
      : /Invalid login/i.test(m) ? "שם משתמש או סיסמה לא נכונים"
      : /Email not confirmed/i.test(m) ? "החשבון ממתין לאישור — כבו את אישור האימייל בהגדרות Supabase"
      : /Password should be/i.test(m) ? "הסיסמה קצרה מדי"
      : m;
    SFX.soft(); return render();
  }
  cloudUser = (res.data && res.data.user) || null;
  if (!cloudUser || !res.data.session) { authErr = "ההרשמה נוצרה אך אין התחברות — בדקו שאישור האימייל כבוי ב-Supabase"; return render(); }
  SFX.win();
  await afterLogin();
}
async function cloudSignOut() {
  try { await cloudPush(); await sb.auth.signOut(); } catch (e) {}
  cloudUser = null; S.cur = null; S.profiles = []; S.rev = 0; persistLocal();
  authTab = "in"; authErr = ""; go("auth");
}

async function cloudResume() {
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session && data.session.user) {
      cloudUser = data.session.user;
      await afterLogin();
      return;
    }
  } catch (e) {}
  view = "auth"; render();
}

/* ------------------------------------------------------------ מסך כניסה */
function viewAuth() {
  return `<div class="pick">
    <div class="logo"><h1>כוכבות החשבון</h1><p>תרגול חשבון לכיתות א'–ו'</p></div>
    <div class="tabs">
      <button data-atab="in" aria-selected="${authTab === "in"}">כניסה</button>
      <button data-atab="up" aria-selected="${authTab === "up"}">הרשמה</button>
    </div>
    <div class="card">
      <label for="au" style="font-size:13px;color:var(--dim)">שם משתמש</label>
      <input id="au" class="txt sel" style="margin-top:6px;direction:ltr;text-align:left;font-size:16px"
        autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="danfamily">
      <label for="ap" style="font-size:13px;color:var(--dim);display:block;margin-top:12px">סיסמה</label>
      <input id="ap" class="txt sel" type="password" style="margin-top:6px;direction:ltr;text-align:left;font-size:16px"
        autocomplete="${authTab === "up" ? "new-password" : "current-password"}" placeholder="לפחות 6 תווים">
      ${authErr ? `<div class="hintbox" style="background:rgba(255,128,149,.12);border-color:rgba(255,128,149,.4);color:#FFC2CC">${esc(authErr)}</div>` : ""}
      <button class="btn pink" style="margin-top:14px" id="authgo">${authTab === "up" ? "יצירת חשבון" : "כניסה"}</button>
      <p style="color:var(--dim);font-size:12.5px;margin-bottom:0">
        ${authTab === "up"
          ? "חשבון אחד למשפחה. בתוכו אפשר ליצור פרופיל נפרד לכל ילד/ה. ההתקדמות נשמרת בענן ועוברת בין מכשירים."
          : "אותו חשבון פותח את אותה התקדמות בכל מכשיר."}</p>
    </div>
    <button class="btn ghost" id="guestgo">כניסה בלי חשבון (נשמר רק על המכשיר)</button>
  </div>`;
}
</script>

<script>
/* =========================================================== battle engine */
let lastResult = null;

function dueMisses(p, topic, n) {
  return p.miss.filter(m => m.due <= p.battles && m.q.topic === topic).slice(0, n).map(m => m.q);
}
function buildBattle(mode, topic, opts) {
  const p = P(); opts = opts || {};
  const sk = p.skills[topic] || { lv: 1 };
  let qs = [], total;
  if (mode === "place") {
    TOPIC_IDS.forEach(t => [2, 4, 6].forEach(L => qs.push(genQ(p, t, L))));
    total = qs.length;
  } else if (mode === "event") {
    total = 12;
    for (let i = 0; i < total; i++) {
      const t = topic === "mix" ? TOPIC_IDS[i % 3] : topic;
      qs.push(genQ(p, t, p.skills[t].lv));
    }
  } else {
    total = mode === "boss" ? 8 : 5;
    const revive = dueMisses(p, topic, mode === "boss" ? 2 : 1);
    revive.forEach(q => qs.push(q));
    while (qs.length < total) qs.push(genQ(p, topic, sk.lv));
    qs = shuffle(qs).slice(0, total);
  }
  B = {
    mode, topic, level: sk.lv, qs, i: 0, correct: 0, tries: 0, input: "",
    combo: 0, maxCombo: 0, marks: [], t0: Date.now(), qt0: Date.now(),
    hint: false, explain: false, seed: rnd(0, 99),
    eventId: opts.eventId, attemptNo: opts.attemptNo, eventType: opts.eventType,
    fun: mode === "fun", game: null
  };
  pickGame();
  go("battle");
}
function pickGame() {
  if (!B.fun) { B.game = null; return; }
  const q = B.qs[B.i];
  const pool = ["bubble", "tf"];
  if (q.line) pool.push("line");
  B.game = pool[(B.i + B.seed) % pool.length];
  if (B.game === "tf") {
    const wrong = Math.random() < .5;
    B.tfShown = wrong ? q.ans + pick([-2, -1, 1, 2, 10]) : q.ans;
    if (B.tfShown < 0) B.tfShown = q.ans + 3;
    B.tfTruth = B.tfShown === q.ans;
  }
  if (B.game === "bubble") B.opts = choicesFor(q);
}

/* ------------------------------------------------------------ battle UI */
function renderBattle() {
  const p = P(), q = B.qs[B.i], total = B.qs.length;
  const hpPct = 100 - Math.round(B.marks.filter(m => m === "ok").length / total * 100);
  const isEvent = B.mode === "event", isPlace = B.mode === "place";
  const label = isEvent ? evTitle(B.eventType, p) : isPlace ? "מבחן מיקום" : B.mode === "boss" ? "קרב בוס" : B.fun ? "אימון כיף" : topicOf(p, B.topic).name;

  const head = `<div class="bhead">
      <button class="chip" data-quit="1">✕</button>
      <div style="flex:1">
        <div style="font-size:12.5px;color:var(--dim)">${label}</div>
        <div class="dots" style="margin-top:5px">${B.qs.map((_, i) =>
          `<i class="${B.marks[i] === "ok" ? "ok" : B.marks[i] === "bad" ? "bad" : i === B.i ? "now" : ""}"></i>`).join("")}</div>
      </div>
      <span class="chip gold"><span class="num">${p.coins}</span> ★</span>
    </div>`;

  const heroArt = `<span class="hero">${mascot(p.avatar, isEvent || isPlace ? 78 : B.mode === "boss" ? 96 : 86, p.acc)}
      ${p.pet ? `<span class="pet">${pet(p.pet, 34)}</span>` : ""}</span>`;
  const stage = (isEvent || isPlace)
    ? `<div class="duel solo">${heroArt}</div>`
    : `<div>
        <div class="duel">${heroArt}<span class="vsx">⚔</span>
          <span class="foe">${monster(B.seed + Math.floor(B.i / 2), B.mode === "boss" ? 126 : 100, B.mode === "boss")}</span></div>
        <div class="hp"><i style="width:${hpPct}%"></i></div>
      </div>`;

  let body;
  if (B.game === "bubble") {
    const pos = [[6, 8], [55, 0], [4, 150], [56, 140]];
    body = `<div class="qbox"><div class="qtext ${q.word ? "word" : ""}">${esc(q.text.replace(" = ?", ""))}</div></div>
      <div class="bubbles">${B.opts.map((o, i) =>
        `<button class="bub" style="right:${pos[i][0]}%;top:${pos[i][1]}px" data-ans="${o}">${o}</button>`).join("")}</div>`;
  } else if (B.game === "tf") {
    body = `<div class="qbox"><div style="font-size:14px;color:var(--dim)">נכון או לא נכון?</div>
      <div class="qtext" style="margin-top:8px">${esc(q.text.replace(" = ?", ""))} = ${B.tfShown}</div></div>
      <div class="tf"><button class="yes" data-tf="1">✓ נכון</button><button class="no" data-tf="0">✗ לא נכון</button></div>`;
  } else if (B.game === "line") {
    const N = q.line, w = 320, step = w / N;
    body = `<div class="qbox"><div class="qtext">${esc(q.text.replace(" = ?", ""))}</div>
      <div style="font-size:13px;color:var(--dim);margin-top:6px">סמנו את התשובה על הציר</div></div>
      <div class="nline"><svg viewBox="0 0 340 74" style="width:100%;height:74px">
        <line x1="10" y1="40" x2="330" y2="40" stroke="#5B44A0" stroke-width="3"/>
        ${[...Array(N + 1)].map((_, i) => {
          const x = 10 + i * step;
          return `<g><line x1="${x}" y1="${i % 5 === 0 ? 28 : 33}" x2="${x}" y2="${i % 5 === 0 ? 52 : 47}" stroke="#8C74D6" stroke-width="2"/>
          ${i % 5 === 0 ? `<text x="${x}" y="68" fill="#BCA7DE" font-size="11" text-anchor="middle">${i}</text>` : ""}
          <rect x="${x - step / 2}" y="16" width="${step}" height="44" fill="transparent" data-ans="${i}" style="cursor:pointer"/></g>`;
        }).join("")}
      </svg></div>`;
  } else {
    body = `<div class="qbox">
      <div class="qtext ${q.word ? "word" : ""}">${esc(q.text)}</div>
      <div class="answer ${B.feedback || ""}" id="ansbox">${B.input || (B.feedback === "ok" ? q.ans : "?")}</div>
    </div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join("")}
    </div>
    <div class="pad" style="grid-template-columns:repeat(${q.dec ? 4 : 3},1fr)">
      <button class="key del" data-k="x">⌫</button>
      <button class="key" data-k="0">0</button>
      ${q.dec ? '<button class="key" data-k=".">.</button>' : ""}
      <button class="key act" data-k="ok">✓</button>
    </div>`;
  }

  const hint = B.hint && !isEvent ? `<div class="hintbox">💡 ${esc(q.hint)}</div>` : "";
  const expl = B.explain ? `<div class="steps-x">${q.steps.map(s =>
      `<div class="lbl">${esc(s[0])}</div><div>${esc(s[1])}</div>`).join("")}
      <button class="btn pink" style="margin-top:12px" data-next="1">הבנתי, ממשיכים</button></div>` : "";

  return `<div class="bwrap">${head}${stage}${body}${hint}${expl}</div>`;
}

/* ------------------------------------------------------------ answering */
function submit(val) {
  if (!B) return;
  const q = B.qs[B.i];
  const correct = Math.abs(parseFloat(val) - q.ans) < 0.001;
  const ms = Date.now() - B.qt0;
  if (correct) {
    SFX.good();
    if (B.tries === 0) playFX(P().fx);
    B.feedback = "ok";
    if (B.tries === 0) { B.correct++; B.marks[B.i] = "ok"; } else B.marks[B.i] = "bad";
    B.combo++; B.maxCombo = Math.max(B.maxCombo, B.combo);
    logAttempt(q, B.tries === 0, ms);
    if (B.combo >= 3 && B.tries === 0) showCombo(B.combo);
    render();
    setTimeout(nextQ, 620);
    return;
  }
  /* wrong */
  B.combo = 0; SFX.hit();
  B.feedback = "no";
  B.tries++;
  if (B.mode === "event" || B.tries >= 2) {
    B.marks[B.i] = "bad";
    logAttempt(q, false, ms);
    if (B.mode === "event") { render(); setTimeout(nextQ, 700); }
    else { B.explain = true; B.hint = false; render(); }
    return;
  }
  B.hint = true;
  render();
  setTimeout(() => { B.feedback = ""; B.input = ""; render(); }, 450);
}
function showCombo(n) {
  const el = document.createElement("div");
  el.className = "combo"; el.textContent = "קומבו ×" + n + "!";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
function nextQ() {
  if (!B) return;
  B.i++; B.tries = 0; B.input = ""; B.feedback = ""; B.hint = false; B.explain = false; B.qt0 = Date.now();
  if (B.i >= B.qs.length) return finish();
  pickGame(); render();
}

/* ------------------------------------------------------------- finishing */
function finish() {
  if (!B) return;
  const p = P(), total = B.qs.length, score = B.correct;
  p.secs += Math.round((Date.now() - B.t0) / 1000);
  p.bestCombo = Math.max(p.bestCombo || 0, B.maxCombo);
  const out = { mode: B.mode, score, total, maxCombo: B.maxCombo, topic: B.topic, coins: 0, leveled: false, fun: false, tier: null };

  if (B.mode === "place") {
    TOPIC_IDS.forEach((t, ti) => {
      const c = B.qs.map((q, i) => ({ q, i })).filter(x => x.q.topic === t && B.marks[x.i] === "ok").length;
      p.skills[t].lv = [1, 3, 5, 7][c] || 1;
    });
    p.placed = true;
    out.coins = 50; coins(p, 50);
  } else if (B.mode === "event") {
    const tier = tierOf(score, total);
    const rec = p.events[B.eventId] || { title: evTitle(B.eventType, p), art: B.eventType.art };
    rec["a" + B.attemptNo] = { score, tier };
    rec.tier = tier;
    const wrongTags = {};
    B.qs.forEach((q, i) => { if (B.marks[i] !== "ok") wrongTags[q.tag] = (wrongTags[q.tag] || 0) + 1; });
    const top = Object.entries(wrongTags).sort((a, b) => b[1] - a[1])[0];
    rec.weak = top ? top[0] : null;
    if (tier !== "none") {
      rec.closed = true;
      p.trophies.push({ tier, art: B.eventType.art, title: evTitle(B.eventType, p), date: today() });
      p.season.evWin = (p.season.evWin || 0) + 1;
      out.coins = TIER_COINS[tier]; coins(p, out.coins);
    } else if (B.attemptNo === 2) {
      rec.closed = true;
    }
    p.events[B.eventId] = rec;
    out.tier = tier; out.weak = rec.weak; out.eventTitle = rec.title;
    out.attemptNo = B.attemptNo; out.closed = !!rec.closed;
  } else {
    const sk = p.skills[B.topic];
    sk.bs = (sk.bs || 0) + 1;
    p.battles++; p.dayGoal = (p.dayGoal || 0) + 1;
    const pass = B.mode === "boss" ? score >= 6 : score >= 4;
    const mid = B.mode === "boss" ? score >= 4 : score === 3;
    if (pass) {
      sk.low = 0;
      if (sk.fun) { sk.fun = false; out.fun = "off"; }
      if (sk.lv < 8) { sk.lv++; out.leveled = true; SFX.level(); }
    } else if (!mid) {
      sk.low = (sk.low || 0) + 1;
      if (sk.low >= 2) { sk.fun = true; sk.low = 0; sk.lv = Math.max(1, sk.lv - 1); out.fun = "on"; }
    } else { sk.low = 0; }
    if (score === total) p.perfects = (p.perfects || 0) + 1;
    if (B.mode === "boss") { sk.bs = 0; if (pass) p.bosses = (p.bosses || 0) + 1; out.coins = 50 + score * 8; }
    else out.coins = 10 + score * 5 + B.maxCombo * 3;
    coins(p, out.coins);
  }
  out.fresh = checkAwards(p);
  persist();
  lastResult = out;
  if (out.fresh && out.fresh.length) { confetti(70); SFX.level(); }
  else if (out.leveled || out.tier === "gold" || out.tier === "silver") { confetti(60); SFX.win(); }
  else if (out.tier === "none" && B.mode === "event") SFX.soft();
  else SFX.win();
  go("result");
}

/* --------------------------------------------------------------- result */
function freshBlock(r) {
  if (!r.fresh || !r.fresh.length) return "";
  return `<div class="sec-title">פרסים חדשים!</div>
    <div class="list">${r.fresh.map(f => `<div class="awardpop">
      ${badgeArt(f.glyph, f.rarity, 46)}
      <div style="flex:1"><b style="color:${RAR[f.rarity].txt}">${esc(f.name)}</b>
      <small>${esc(f.req)} · ${RAR[f.rarity].name}</small></div></div>`).join("")}</div>`;
}
function viewResult() {
  const p = P(), r = lastResult, fb = freshBlock(r);
  if (r.mode === "event") {
    if (r.tier === "none") {
      const again = r.attemptNo === 1;
      return `<div class="bwrap center" style="justify-content:center;gap:8px">
        <div class="mascot-wrap">${mascot(p.avatar, 108, p.acc)}</div>
        <h2 style="font-size:24px">${again ? "מועד א' לא הסתדר" : "הפעם הבמה לא הייתה שלנו"}</h2>
        <p style="color:var(--dim)">${r.score} נכון מתוך ${r.total}</p>
        <div class="soft" style="text-align:right">
          ${r.weak ? `<div style="font-size:13px;color:var(--dim)">רוב הטעויות היו ב:</div><b style="font-family:var(--disp);font-size:17px">${esc(r.weak)}</b>` : ""}
          <p style="font-size:14.5px;margin-bottom:0">${again
            ? "יש לך עוד הזדמנות אחת — <b>מועד ב'</b>. כדאי להתאמן קודם."
            : "האירוע הבא בעוד כמה ימים, ו" + T("את תהיי מוכנה", "אתה תהיה מוכן") + " 💜"}</p>
        </div>
        ${fb}
        <button class="btn pink" data-play="${r.topic === "mix" ? "add" : r.topic}">${T("בואי", "בוא")} נתאמן על זה</button>
        <button class="btn ghost" data-go="home">לבית</button>
      </div>`;
    }
    return `<div class="bwrap center" style="justify-content:center;gap:8px">
      <div class="mascot-wrap">${trophyArt(p.trophies[p.trophies.length - 1].art, r.tier, 120)}</div>
      <h2 style="font-size:26px">פרס ${TIER_TXT[r.tier]}! ✦</h2>
      <p style="color:var(--dim)">${r.score} נכון מתוך ${r.total} · ${esc(r.eventTitle)}</p>
      <div class="rewardrow"><div class="tile"><b class="num">+${r.coins}</b><span>כוכבים</span></div>
        <div class="tile"><b>1</b><span>פרס בלעדי</span></div></div>
      <p style="font-size:14px;color:var(--dim)">הפרס נוסף לאוסף. האירוע הזה נסגר — הבא בקרוב.</p>
      ${fb}
      <button class="btn" data-go="home">מעולה!</button>
    </div>`;
  }
  if (r.mode === "place") {
    return `<div class="bwrap center" style="justify-content:center;gap:10px">
      <div class="mascot-wrap">${mascot(p.avatar, 108, p.acc)}</div>
      <h2 style="font-size:25px">מצאנו את הרמה שלך!</h2>
      <div class="list" style="width:100%">${TOPIC_IDS.map(id =>
        `<div class="lrow"><b style="min-width:96px">${topicOf(p, id).name}</b>
          <div class="bar"><i style="width:${p.skills[id].lv / 8 * 100}%;background:${topicOf(p, id).color}"></i></div>
          <span class="pill">רמה ${p.skills[id].lv}</span></div>`).join("")}</div>
      ${fb}
      <button class="btn pink" data-go="home">קדימה לתרגול</button>
    </div>`;
  }
  const stars = Math.max(1, Math.round(r.score / r.total * 3));
  return `<div class="bwrap center" style="justify-content:center;gap:8px">
    <div style="font-size:40px;letter-spacing:6px;color:var(--gold)">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <h2 style="font-size:26px">${r.leveled ? "עלית רמה! ✦" : r.score >= r.total - 1 ? "מדהים!" : r.score >= r.total / 2 ? "כל הכבוד!" : "עבודה יפה"}</h2>
    <div class="mascot-wrap">${mascot(p.avatar, 96, p.acc)}</div>
    <div class="rewardrow">
      <div class="tile"><b class="num">${r.score}/${r.total}</b><span>נכון</span></div>
      <div class="tile"><b class="num">+${r.coins}</b><span>כוכבים</span></div>
      <div class="tile"><b class="num">×${r.maxCombo}</b><span>קומבו</span></div>
    </div>
    ${r.fun === "on" ? `<div class="soft" style="font-size:14.5px">עוברים ל<b>מצב אימון כיף</b> — אותם תרגילים, אבל במשחקים. נתאמן עד שזה נכנס ✦</div>` : ""}
    ${r.fun === "off" ? `<div class="soft" style="font-size:14.5px">יצאת ממצב האימון — הרמה חזרה לעלות! 🎉</div>` : ""}
    ${fb}
    <button class="btn pink" data-play="${r.topic}">עוד קרב</button>
    <button class="btn ghost" data-go="home">לבית</button>
  </div>`;
}

/* ----------------------------------------------------------------- wiring */
function wireScreen() {
  const p = P();

  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => {
    const t = b.dataset.play, sk = P().skills[t];
    SFX.tap(); buildBattle(sk.fun ? "fun" : "normal", t);
  });
  document.querySelectorAll("[data-boss]").forEach(b => b.onclick = () => { SFX.tap(); buildBattle("boss", b.dataset.boss); });
  const quit = document.querySelector("[data-quit]");
  if (quit) quit.onclick = () => { SFX.tap(); B = null; go("home", "home"); };

  /* keypad */
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (B.explain) return;
    SFX.tap();
    if (k === "x") { B.input = B.input.slice(0, -1); B.feedback = ""; }
    else if (k === "ok") { if (B.input === "" || B.input === ".") return; return submit(B.input); }
    else if (k === "." ) { if (B.input.indexOf(".") < 0 && B.input) { B.input += "."; B.feedback = ""; } }
    else if (B.input.length < 6) { B.input += k; B.feedback = ""; }
    const box = $("#ansbox"); if (box) { box.textContent = B.input || "?"; box.className = "answer"; }
  });
  document.querySelectorAll("[data-ans]").forEach(b => b.onclick = () => submit(b.dataset.ans));
  document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => {
    const said = b.dataset.tf === "1";
    submit(said === B.tfTruth ? B.qs[B.i].ans : B.qs[B.i].ans + 999);
  });
  const nx = document.querySelector("[data-next]"); if (nx) nx.onclick = () => { SFX.tap(); nextQ(); };

  /* profile select */
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    S.cur = b.dataset.p; persist(); touchDay(); SFX.tap();
    go("home", "home");
  });
  const add = $("#add"); if (add) add.onclick = () => { newp = { name: "", avatar: "luna" }; render(); };
  const cancel = $("#cancel"); if (cancel) cancel.onclick = () => { newp = null; render(); };
  document.querySelectorAll("[data-av]").forEach(b => b.onclick = () => {
    newp.avatar = b.dataset.av; newp.name = ($("#nm") || {}).value || newp.name; SFX.tap(); render();
  });
  const mk = $("#mk"); if (mk) mk.onclick = () => {
    const nm = ($("#nm").value || "").trim() || "כוכבת";
    const np = newProfile(nm, newp.avatar, newp.grade || 2, newp.sex || "f");
    if (!np.owned.includes(newp.avatar)) np.owned.push(newp.avatar);
    S.profiles.push(np); S.cur = np.id; newp = null; persist(); touchDay();
    SFX.win(); confetti(30); go("home", "home");
  };
  document.querySelectorAll("#snd,#snd2").forEach(b => b.onclick = () => { S.sound = !S.sound; persist(); SFX.tap(); render(); });
  document.querySelectorAll("#par,#par2").forEach(b => b.onclick = () => { pinBuf = ""; go("parent"); });

  /* placement */
  const pl = $("#placebtn"); if (pl) pl.onclick = () => { SFX.tap(); buildBattle("place", "add"); };
  const sk = $("#skipplace"); if (sk) sk.onclick = () => { P().placed = true; persist(); render(); };

  /* collection tabs */
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    collectTab = b.dataset.tab; SFX.tap(); render();
  });
  /* shop tabs */
  document.querySelectorAll("[data-stab]").forEach(b => b.onclick = () => {
    shopTab = b.dataset.stab; SFX.tap(); render();
  });

  /* shop */
  document.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    const [kind, id, cost] = b.dataset.buy.split("|");
    buy(kind, id, Number(cost));
  });

  /* room */
  const sv = $("#sv"); if (sv) sv.onclick = () => {
    const v = ($("#rn").value || "").trim(); if (v) { P().name = v; persist(); toast("נשמר ✦"); render(); }
  };

  /* events */
  const se = document.querySelector("[data-startev]"); if (se) se.onclick = () => {
    const ev = eventState(P()), left = eventAttemptsLeft(ev.rec);
    if (!left) return;
    SFX.tap();
    buildBattle("event", ev.type.topic, { eventId: ev.id, attemptNo: left === 2 ? 1 : 2, eventType: ev.type });
  };

  /* auth */
  document.querySelectorAll("[data-atab]").forEach(b => b.onclick = () => { authTab = b.dataset.atab; authErr = ""; SFX.tap(); render(); });
  const ago = $("#authgo"); if (ago) ago.onclick = () => {
    SFX.tap(); ago.textContent = "רגע..."; doAuth(authTab, $("#au").value, $("#ap").value);
  };
  const gst = $("#guestgo"); if (gst) gst.onclick = () => {
    S.guest = true; persistLocal(); SFX.tap();
    if (!S.profiles.length) newp = { name: "", avatar: "luna", grade: 2 };
    go("pick");
  };
  const so = $("#signout"); if (so) so.onclick = () => { SFX.tap(); cloudSignOut(); };

  /* grades */
  document.querySelectorAll("[data-newsex]").forEach(b => b.onclick = () => {
    newp.sex = b.dataset.newsex;
    newp.name = ($("#nm") || {}).value || newp.name;
    SFX.tap(); render();
  });
  document.querySelectorAll("[data-setsex]").forEach(b => b.onclick = () => {
    P().sex = b.dataset.setsex; persist(); SFX.tap(); render();
  });
  document.querySelectorAll("[data-newgrade]").forEach(b => b.onclick = () => {
    newp.grade = Number(b.dataset.newgrade);
    newp.name = ($("#nm") || {}).value || newp.name;
    SFX.tap(); render();
  });
  document.querySelectorAll("[data-setgrade]").forEach(b => b.onclick = () => {
    const g = Number(b.dataset.setgrade), p2 = P();
    if (p2.grade === g) return;
    p2.grade = g;
    SLOTS.forEach(t => { p2.skills[t] = { lv: 1, fun: false, low: 0, bs: 0 }; });
    p2.placed = false; persist(); SFX.tap(); toast("הכיתה שונתה ל" + GRADES[g - 1].name); render();
  });
  const pg = $("#promgo"); if (pg) pg.onclick = () => {
    if (!promoteArmed) { promoteArmed = true; SFX.tap(); return render(); }
    promoteArmed = false; promote(P()); SFX.level(); confetti(70);
    toast("מזל טוב! עלית ל" + gradeOf(P()).name); go("home", "home");
  };
  const pc = $("#promcancel"); if (pc) pc.onclick = () => { promoteArmed = false; SFX.tap(); render(); };

  /* backup & compare */
  const copyFrom = (sel, okMsg) => {
    const el = $(sel); if (!el) return;
    el.removeAttribute("readonly"); el.select(); el.setSelectionRange(0, 99999);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    el.setAttribute("readonly", "readonly");
    if (navigator.clipboard && !done) {
      navigator.clipboard.writeText(el.value).then(() => toast(okMsg)).catch(() => toast("סמנו את הקוד והעתיקו ידנית"));
      return;
    }
    toast(done ? okMsg : "סמנו את הקוד והעתיקו ידנית");
  };
  const bkc = $("#bkcopy"); if (bkc) bkc.onclick = () => { SFX.tap(); copyFrom("#bkcode", "הקוד הועתק ✦"); };
  const frc = $("#frcopy"); if (frc) frc.onclick = () => { SFX.tap(); copyFrom("#frcode", "הקוד הועתק ✦"); };
  const bkf = $("#bkfile"); if (bkf) bkf.onclick = () => {
    SFX.tap();
    saveTextFile("kochavot-backup-" + today() + ".txt", $("#bkcode").value, toast);
  };
  const rsg = $("#rsgo"); if (rsg) rsg.onclick = () => {
    const r = restoreCode($("#rscode").value);
    if (r.err) { SFX.soft(); return toast(r.err); }
    SFX.win(); confetti(30);
    toast("שוחזרו " + (r.added + r.merged) + " פרופילים");
    go("pick");
  };
  const fra = $("#fradd-go"); if (fra) fra.onclick = () => {
    const r = parseFriend($("#fradd").value);
    if (r.err) { SFX.soft(); return toast(r.err); }
    S.rivals = (S.rivals || []).filter(x => x.n !== r.snap.n);
    S.rivals.push(r.snap);
    if (S.rivals.length > 6) S.rivals.shift();
    cmpOther = "r:" + (S.rivals.length - 1);
    persist(); SFX.win(); toast(r.snap.n + " נוספה להשוואה ✦"); render();
  };
  document.querySelectorAll("[data-cmp]").forEach(b => b.onclick = () => {
    cmpOther = b.dataset.cmp; SFX.tap(); render();
  });

  /* parent pin */
  document.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => {
    const k = b.dataset.pin; SFX.tap();
    if (k === "x") pinBuf = pinBuf.slice(0, -1);
    else if (k === "ok") {
      if (pinBuf.length !== 4) return toast("צריך 4 ספרות");
      if (!S.pin) { S.pin = pinBuf; persist(); parentUnlocked = true; toast("הקוד נשמר"); }
      else if (S.pin === pinBuf) parentUnlocked = true;
      else { pinBuf = ""; SFX.soft(); return render(), toast("קוד שגוי"); }
      pinBuf = ""; return render();
    } else if (pinBuf.length < 4) pinBuf += k;
    render();
  });
  const po = $("#pinout"); if (po) po.onclick = () => { parentUnlocked = false; go("pick"); };
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const t = S.profiles.find(x => x.id === b.dataset.reset);
    TOPIC_IDS.forEach(id => { t.skills[id] = { lv: 1, fun: false, low: 0, bs: 0 }; });
    t.placed = false; persist(); toast("הרמות אופסו"); render();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "בטוח? לחצו שוב"; return; }
    S.profiles = S.profiles.filter(x => x.id !== b.dataset.del);
    if (S.cur === b.dataset.del) S.cur = null;
    persist(); render();
  });
}

/* -------------------------------------------------------------------- boot */
(function boot() {
  if (CLOUD_READY && !S.guest) {
    cloudInit();
    view = "auth"; render();
    cloudResume();
  } else {
    if (!S.profiles.length) newp = { name: "", avatar: "luna", grade: 2 };
    view = "pick";
    render();
  }
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (view !== "battle" || !B || B.game || !B.qs[B.i]) return;
    if (/^[0-9]$/.test(e.key) && B.input.length < 6) { B.input += e.key; B.feedback = ""; render(); }
    else if (e.key === "." && B.qs[B.i].dec && B.input.indexOf(".") < 0 && B.input) { B.input += "."; render(); }
    else if (e.key === "Backspace") { B.input = B.input.slice(0, -1); render(); }
    else if (e.key === "Enter" && B.input) submit(B.input);
  });
})();
</script>
