<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140D26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כוכבות החשבון">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<title>כוכבות החשבון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
:root{
  --night:#140D26; --stage:#20153E; --raised:#2C1E55; --line:#3D2C6E;
  --ink:#FCF4FF; --dim:#BCA7DE;
  --lav:#B79CED; --pink:#FF8FC7; --cyan:#6EE7F9; --gold:#FFD86E; --mint:#7CE7B4; --danger:#FF8095;
  --rl:28px; --rm:18px; --rs:12px;
  --disp:"Secular One",system-ui,sans-serif;
  --body:"Varela Round",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--night); color:var(--ink); font-family:var(--body);
  direction:rtl; text-align:right; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  font-size:16px; line-height:1.5;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60% 40% at 20% 0%, rgba(183,156,237,.22), transparent 70%),
    radial-gradient(50% 35% at 85% 8%, rgba(255,143,199,.18), transparent 70%),
    radial-gradient(70% 45% at 50% 100%, rgba(110,231,249,.10), transparent 70%);
}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;padding-inline:16px;padding-block:0 96px;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shared bits ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:14px 10px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--night) 72%,transparent)}
.tb-face{width:42px;height:42px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--line)}
.tb-name{font-family:var(--disp);font-size:17px;line-height:1.1}
.tb-sub{font-size:12px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--raised);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:14px;font-family:var(--disp)}
.chip.gold{color:var(--gold)} .chip.fire{color:var(--pink)}
.spacer{flex:1}

.card{background:var(--stage);border:1px solid var(--line);border-radius:var(--rl);padding:18px}
.soft{background:var(--raised);border-radius:var(--rm);padding:14px}

.btn{display:block;width:100%;text-align:center;font-family:var(--disp);font-size:19px;padding:16px 18px;
  border-radius:var(--rm);background:linear-gradient(180deg,var(--lav),#8F6FD6);color:#22103F;
  box-shadow:0 5px 0 #6E4FB4;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6E4FB4}
.btn.pink{background:linear-gradient(180deg,var(--pink),#E2609F);box-shadow:0 5px 0 #B4437C;color:#3A0E28}
.btn.gold{background:linear-gradient(180deg,var(--gold),#E8B93C);box-shadow:0 5px 0 #B98F1C;color:#3A2A00}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--dim);box-shadow:none;font-size:16px;padding:12px}
.btn.ghost:active{transform:none;background:var(--raised)}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  background:linear-gradient(transparent,var(--night) 42%);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.nav-in{display:flex;gap:4px;background:var(--stage);border:1px solid var(--line);border-radius:999px;padding:6px;width:100%;max-width:428px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px;border-radius:999px;font-size:10.5px;color:var(--dim);min-width:0}
.nav button span{white-space:nowrap}
.nav button[aria-current="true"]{background:var(--raised);color:var(--ink)}

/* ---------- prizes ---------- */
.holo{animation:holo 4.5s linear infinite}
@keyframes holo{0%{filter:hue-rotate(0deg) saturate(1.35) drop-shadow(0 0 6px rgba(110,231,249,.7))}
  50%{filter:hue-rotate(180deg) saturate(1.6) drop-shadow(0 0 13px rgba(255,143,199,.8))}
  100%{filter:hue-rotate(360deg) saturate(1.35) drop-shadow(0 0 6px rgba(110,231,249,.7))}}
.prize{background:var(--stage);border:1px solid var(--line);border-radius:var(--rm);padding:12px 10px 11px;text-align:center;position:relative}
.prize.got{border-color:var(--lav)}
.prize.glowgot{border-color:#6EE7F9;box-shadow:0 0 0 1px rgba(110,231,249,.3)}
.prize b{display:block;font-family:var(--disp);font-size:12.5px;margin-top:6px;line-height:1.3}
.prize .req{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.prize .rar{display:inline-block;font-size:9.5px;border-radius:99px;padding:2px 8px;background:var(--raised);margin-top:6px}
.mini{height:6px;border-radius:99px;background:#3A2A66;overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;border-radius:99px}
.seasonbar{border-radius:var(--rl);padding:16px;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.seasonbar .halo{position:absolute;inset:-45% -25% auto auto;width:220px;height:220px;border-radius:50%;filter:blur(42px);opacity:.45}
.awardpop{display:flex;align-items:center;gap:12px;background:var(--raised);border-radius:var(--rm);padding:10px 12px;text-align:right}
.awardpop b{font-family:var(--disp);font-size:15px;display:block}
.awardpop small{font-size:11.5px;color:var(--dim)}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button{flex:1;padding:9px 4px;border-radius:99px;background:var(--stage);border:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);font-family:var(--disp)}
.aura1{filter:drop-shadow(0 0 7px rgba(255,216,110,.8))}
.aura2{animation:aura2 3.4s ease-in-out infinite}
@keyframes aura2{0%{filter:drop-shadow(0 0 7px rgba(110,231,249,.9))}33%{filter:drop-shadow(0 0 13px rgba(255,143,199,.9))}66%{filter:drop-shadow(0 0 13px rgba(255,216,110,.9))}100%{filter:drop-shadow(0 0 7px rgba(110,231,249,.9))}}

/* ---------- answer effects ---------- */
.fxwrap{position:fixed;inset:0;pointer-events:none;z-index:45}
.fxp{position:absolute;left:50%;top:46%;animation:fxp .95s ease-out forwards;text-shadow:0 0 10px currentColor}
@keyframes fxp{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
  15%{opacity:1}
  100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(40deg);opacity:0}}
.fxword{position:absolute;left:50%;top:38%;font-family:var(--disp);font-size:clamp(30px,9vw,40px);
  white-space:nowrap;animation:fxw 1.05s ease-out forwards;text-shadow:0 0 20px currentColor}
@keyframes fxw{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.16);opacity:1}
  70%{transform:translate(-50%,calc(-50% - 10px)) scale(1);opacity:1}
  100%{transform:translate(-50%,calc(-50% - 38px)) scale(1);opacity:0}}
.fxprev{position:relative;display:inline-block;font-size:27px;line-height:1.1;text-shadow:0 0 9px currentColor}
.fxprev i{font-style:normal;font-size:13px;position:absolute;opacity:.85}
.fxprev i:first-of-type{top:-7px;inset-inline-start:-15px}
.fxprev i:last-of-type{bottom:-5px;inset-inline-end:-15px}
.fxword-mini{display:block;font-family:var(--disp);font-size:13px;margin-top:5px}
.item span{display:block;font-size:11.5px;color:var(--dim);line-height:1.4}
.item span.fxprev{display:inline-block;font-size:27px;color:inherit}
.item span.fxword-mini{font-size:13px;color:inherit}
.item span.avdisc{display:inline-grid;width:max-content;aspect-ratio:1;margin:0 auto}
.nav svg{width:22px;height:22px}

/* ---------- profile select ---------- */
.pick{display:flex;flex-direction:column;justify-content:center;min-height:100dvh;gap:20px;padding-block:32px}
.logo{text-align:center}
.logo h1{font-size:clamp(34px,11vw,46px);line-height:1.05;
  background:linear-gradient(100deg,var(--gold),var(--pink) 45%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(255,143,199,.35))}
.logo p{color:var(--dim);font-size:14px;margin:6px 0 0}
.pcard{display:flex;align-items:center;gap:14px;background:var(--stage);border:1px solid var(--line);
  border-radius:var(--rl);padding:14px;width:100%;text-align:right;transition:transform .1s}
.pcard:active{transform:scale(.98)}
.pcard .av{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.16), 0 6px 18px rgba(0,0,0,.35)}
.pcard h3{font-size:21px}
.pcard span{font-size:13px;color:var(--dim)}

/* ---------- map ---------- */
.topic{border-radius:var(--rl);padding:16px;border:1px solid var(--line);background:var(--stage);position:relative;overflow:hidden}
.topic .glow{position:absolute;inset:auto -30% -60% auto;width:180px;height:180px;border-radius:50%;filter:blur(34px);opacity:.5}
.topic h3{font-size:19px;position:relative}
.topic .sub{font-size:12.5px;color:var(--dim);position:relative;margin-top:2px}
.steps{display:flex;gap:6px;margin:12px 0 14px;position:relative}
.step{flex:1;height:9px;border-radius:99px;background:#3A2A66}
.step.on{background:currentColor;box-shadow:0 0 8px currentColor}
.step.now{background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
.rowbtns{display:flex;gap:8px;position:relative}
.rowbtns .btn{font-size:16px;padding:13px}
.tagfun{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mint);
  background:rgba(124,231,180,.12);border-radius:99px;padding:3px 9px;margin-top:2px}

/* ---------- battle ---------- */
.bwrap{display:flex;flex-direction:column;min-height:100dvh;padding-block:10px 20px}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hp{flex:1;height:14px;border-radius:99px;background:#3A2A66;overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .45s cubic-bezier(.2,.9,.3,1)}
.qbox{background:var(--stage);border:1px solid var(--line);border-radius:var(--rl);padding:22px 18px;text-align:center;margin-top:10px}
.qtext{font-family:var(--disp);font-size:clamp(30px,10vw,42px);letter-spacing:1px;direction:ltr;unicode-bidi:isolate}
.qtext.word{font-family:var(--body);font-size:19px;line-height:1.7;direction:rtl;text-align:right;letter-spacing:0}
.answer{margin-top:14px;height:62px;border-radius:var(--rm);background:var(--raised);border:2px dashed var(--line);
  display:grid;place-items:center;font-family:var(--disp);font-size:34px;letter-spacing:2px}
.answer.ok{border:2px solid var(--mint);background:rgba(124,231,180,.14);color:var(--mint)}
.answer.no{border:2px solid var(--danger);background:rgba(255,128,149,.12);color:var(--danger);animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;direction:ltr}
.key{background:var(--raised);border:1px solid var(--line);border-radius:var(--rm);padding:15px 0;
  font-family:var(--disp);font-size:26px;text-align:center;transition:transform .07s}
.key:active{transform:scale(.94);background:var(--lav);color:#22103F}
.key.act{background:linear-gradient(180deg,var(--mint),#4FC48C);color:#0C2E1F}
.key.del{color:var(--dim)}
.hintbox{margin-top:12px;background:rgba(110,231,249,.10);border:1px solid rgba(110,231,249,.35);
  border-radius:var(--rm);padding:12px 14px;font-size:15px;color:#CDF4FB}
.steps-x{margin-top:12px;background:var(--raised);border-radius:var(--rm);padding:14px;font-size:16px}
.steps-x div{padding:7px 0;border-bottom:1px dashed var(--line);direction:ltr;text-align:center;font-family:var(--disp);font-size:19px}
.steps-x div:last-child{border:0}
.steps-x .lbl{font-family:var(--body);font-size:13px;color:var(--dim);direction:rtl;text-align:right;border:0;padding-bottom:2px}
.combo{position:fixed;top:22%;left:0;right:0;text-align:center;font-family:var(--disp);font-size:44px;
  color:var(--gold);pointer-events:none;z-index:40;text-shadow:0 0 18px rgba(255,216,110,.7);animation:pop .8s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1) translateY(-40px);opacity:0}}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#3A2A66;display:block}
.dots i.ok{background:var(--mint)} .dots i.bad{background:var(--danger)} .dots i.now{background:var(--gold)}

/* mini games */
.bubbles{position:relative;height:290px;margin-top:12px}
.bub{position:absolute;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-size:30px;color:#22103F;
  background:radial-gradient(circle at 32% 28%,#fff,var(--lav));box-shadow:0 6px 18px rgba(0,0,0,.35);
  animation:float 3.4s ease-in-out infinite}
.bub:nth-child(2){animation-delay:-.9s;background:radial-gradient(circle at 32% 28%,#fff,var(--pink))}
.bub:nth-child(3){animation-delay:-1.8s;background:radial-gradient(circle at 32% 28%,#fff,var(--cyan))}
.bub:nth-child(4){animation-delay:-2.6s;background:radial-gradient(circle at 32% 28%,#fff,var(--gold))}
.bub:active{transform:scale(.88)}
@keyframes float{50%{transform:translateY(-16px)}}
.tf{display:flex;gap:12px;margin-top:16px}
.tf button{flex:1;padding:26px 0;border-radius:var(--rl);font-family:var(--disp);font-size:22px;border:2px solid var(--line);background:var(--raised)}
.tf .yes{color:var(--mint)} .tf .no{color:var(--danger)}
.nline{margin-top:16px;background:var(--raised);border-radius:var(--rm);padding:16px 10px}

/* result / generic sheets */
.center{text-align:center}
.big{font-family:var(--disp);font-size:40px}
.rewardrow{display:flex;gap:10px;justify-content:center;margin:14px 0}
.tile{background:var(--raised);border-radius:var(--rm);padding:12px 16px;text-align:center;min-width:88px}
.tile b{display:block;font-family:var(--disp);font-size:24px;direction:ltr}
.tile span{font-size:12px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--stage);border:1px solid var(--line);border-radius:var(--rm);padding:12px 8px;text-align:center}
.item.own{border-color:var(--mint)}
.item.eq{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,216,110,.25)}
.item b{display:block;font-family:var(--disp);font-size:13px;margin-top:6px}
.item span{font-size:11.5px;color:var(--dim)}
.locked{opacity:.5}
.sec-title{font-family:var(--disp);font-size:15px;color:var(--dim);margin:18px 0 8px}
.list{display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--stage);border:1px solid var(--line);border-radius:var(--rm);padding:12px 14px;font-size:14.5px}
.lrow b{font-family:var(--disp);font-size:15px}
.bar{height:8px;border-radius:99px;background:#3A2A66;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--lav)}
.pill{font-size:11.5px;border-radius:99px;padding:3px 9px;background:var(--raised);color:var(--dim)}
.pill.g{background:rgba(255,216,110,.16);color:var(--gold)}
.pill.s{background:rgba(220,225,240,.14);color:#D8DCEC}
.pill.b{background:rgba(214,146,90,.16);color:#E0A173}
.pill.m{background:rgba(124,231,180,.14);color:var(--mint)}
input.txt,textarea.txt{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--rm);
  padding:13px 14px;color:var(--ink);font-family:var(--body);font-size:16px;display:block}
textarea.txt{resize:vertical;line-height:1.5;font-size:12px;word-break:break-all;direction:ltr;text-align:left}
.sel{-webkit-user-select:text;user-select:text}

/* ---------- comparison ---------- */
.cmp-head{display:flex;align-items:center;gap:8px;text-align:center}
.cmp-head>div{flex:1;background:var(--stage);border:1px solid var(--line);border-radius:var(--rl);padding:12px 8px}
.cmp-head b{display:block;font-family:var(--disp);font-size:16px}
.cmp-head span{font-size:11.5px;color:var(--dim)}
.cmp-head .vs{flex:0 0 auto;background:none;border:0;font-family:var(--disp);font-size:18px;color:var(--gold);padding:0}
.cmp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cmp:last-child{border:0}
.cmp-l{flex:0 0 38%;font-size:13px;color:var(--dim);line-height:1.3}
.cmp-bars{flex:1;display:flex;gap:10px}
.cmp-side{flex:1}
.cmp-side span{display:block;font-family:var(--disp);font-size:15px;text-align:center}
.cmp-side span.win{color:var(--gold)}
.gradegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gradebtn{background:var(--stage);border:1px solid var(--line);border-radius:var(--rm);padding:12px 10px;text-align:center}
.gradebtn.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,216,110,.25)}
.gradebtn b{display:block;font-family:var(--disp);font-size:16px}
.gradebtn span{display:block;font-size:10.5px;color:var(--dim);line-height:1.35;margin-top:3px}
.avdisc{display:inline-grid;place-items:center;border-radius:50%;padding:9px;
  width:max-content;aspect-ratio:1;line-height:0;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.15),rgba(0,0,0,.26));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14), 0 5px 14px rgba(0,0,0,.30)}
.item.eq .avdisc{box-shadow:inset 0 0 0 3px var(--gold), 0 0 20px rgba(255,216,110,.28)}
.item.own .avdisc{box-shadow:inset 0 0 0 2px rgba(124,231,180,.55), 0 6px 16px rgba(0,0,0,.32)}
.duel{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin:2px 0 6px}
.duel.solo{justify-content:center;margin-bottom:2px}
.duel .hero,.duel .foe{position:relative;flex:0 0 auto;line-height:0}
.duel .hero .pet{position:absolute;bottom:-2px;inset-inline-start:-16px;line-height:0}
.duel .vsx{font-family:var(--disp);color:var(--gold);font-size:17px;opacity:.65;padding-bottom:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:12px;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.mascot-wrap{display:grid;place-items:center;margin:6px 0}
.bounce{animation:bnc 1.9s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-9px)}}
.toast{position:fixed;bottom:104px;left:16px;right:16px;max-width:428px;margin:0 auto;z-index:60;
  background:var(--raised);border:1px solid var(--line);border-radius:var(--rm);padding:12px 16px;text-align:center;
  font-size:14.5px;animation:up .3s}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="app"></div>
<script>
/* ==========================================================================
   כוכבות החשבון — Kochavot HaCheshbon
   Single-file adaptive Hebrew math practice app for two kids.
   ========================================================================== */
"use strict";

/* ---------------------------------------------------------------- utils */
const $ = (s, r) => (r || document).querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const SLOTS = ["t0", "t1", "t2"];

const gradeOf = p => GRADES[Math.max(0, Math.min(5, (p.grade || 2) - 1))];
const topicOf = (p, slot) => gradeOf(p).topics[SLOTS.indexOf(slot)];

function genQ(p, slot, L) {
  L = Math.max(1, Math.min(8, L));
  const t = topicOf(p, slot);
  let q;
  try { q = t.gen(L); } catch (e) { q = Q("1 + 1 = ?", 2, "חיבור", "", null); }
  q.topic = slot; q.level = L;
  q.id = slot + L + "|" + q.text;
  return q;
}
function choicesFor(q) {
  const set = new Set([q.ans]);
  let guard = 0;
  while (set.size < 4 && guard++ < 40) {
    const step = q.dec ? pick([-0.2, -0.1, 0.1, 0.2, 0.3]) : pick([-10, -2, -1, 1, 2, 3, 10, -3]);
    const d = q.dec ? r1(q.ans + step) : q.ans + step;
    if (d >= 0 && d !== q.ans) set.add(d);
  }
  while (set.size < 4) set.add(q.ans + set.size + 3);
  return shuffle([...set]);
}

function weakSpots(p, n) {
  const c = {};
  p.log.slice(-120).forEach(a => { if (!a.ok) c[a.tag] = (c[a.tag] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n || 3);
}
function accuracy(p, days) {
  const from = dayNum() - (days || 7);
  const rows = p.log.filter(a => a.d >= from);
  if (!rows.length) return null;
  return Math.round(100 * rows.filter(a => a.ok).length / rows.length);
}

/* --------------------------------------------------------------- events */
function eventState(p) {
  const d = dayNum() - p.anchor, cyc = Math.floor(d / 5), pos = ((d % 5) + 5) % 5;
  const type = EVENT_TYPES[cyc % EVENT_TYPES.length];
  const id = "e" + cyc;
  const rec = p.events[id] || null;
  return { id, cyc, type, open: pos < 2, closesInDays: 2 - pos, nextInDays: 5 - pos, rec };
}
function eventAttemptsLeft(rec) {
  if (!rec) return 2;                    // מועד א' + מועד ב'
  if (rec.closed) return 0;
  return rec.a1 ? 1 : 2;
}
function tierOf(score, total) {

  if (pct >= .9) return "gold";
  if (pct >= .75) return "silver";

}
const TIER_TXT = { gold: "זהב", silver: "כסף", bronze: "ארד", none: "לא עבר" };

function toast(msg) {
  const old = $(".toast"); if (old) old.remove();

}
function confetti(n) {
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const cols = ["#FFD86E", "#FF8FC7", "#6EE7F9", "#B79CED", "#7CE7B4"];
  for (let i = 0; i < (n || 40); i++) {
    const c = document.createElement("i");
    c.style.left = Math.random() * 100 + "%";
    c.style.top = "-20px";
    c.style.background = pick(cols);
    c.style.animationDuration = (1.2 + Math.random() * 1.2) + "s";
    c.style.animationDelay = (Math.random() * .4) + "s";
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 3000);
}
/* the little celebration after every correct answer — bought in the shop */
function playFX(id, word) {
  const f = FXBY[id] || SHOP.fx[0];
  const wrap = document.createElement("div");
  wrap.className = "fxwrap";
  const n = 14;
  for (let i = 0; i < n; i++) {
    const sp = document.createElement("span");
    sp.className = "fxp"; sp.textContent = f.g; sp.style.color = f.c;
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.6;
    const dist = 80 + Math.random() * 120;
    sp.style.setProperty("--x", Math.cos(ang) * dist + "px");
    sp.style.setProperty("--y", (Math.sin(ang) * dist - 30) + "px");
    sp.style.fontSize = (15 + Math.random() * 18) + "px";
    sp.style.animationDelay = (Math.random() * .12) + "s";
    wrap.appendChild(sp);
  }
  const w = document.createElement("b");
  w.className = "fxword"; w.textContent = word || pick(f.w); w.style.color = f.c;
  wrap.appendChild(w);
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1150);
}
function coins(p, n) {
  p.coins += n;
  p.xp = (p.xp || 0) + n;
  if (p.season) p.season.xp += n;
  persist();
}

/* ------------------------------------------------------------ rendering */
function go(v, n) { view = v; if (n) nav = n; window.scrollTo(0, 0); render(); }

function navBar() {
  const items = [["home", "בית", ICONS.home], ["collect", "אוסף", ICONS.badge], ["shop", "חנות", ICONS.shop], ["events", "אירועים", ICONS.event], ["room", "אני", ICONS.room]];

    `<button data-nav="${k}" aria-current="${nav === k}">${ic}<span>${l}</span></button>`).join("")}</div></div>`;
}
const streakTxt = n => n === 1 ? "יום אחד ברצף" : n + " ימים ברצף";
function topBar() {
  const p = P();
  return `<div class="topbar">
    <button class="tb-face" data-go="pick" aria-label="החלפת פרופיל">${mascot(p.avatar, 34, p.acc)}</button>
    <div><div class="tb-name">${esc(p.name)}</div><div class="tb-sub">${gradeOf(p).name} · ${streakTxt(p.streak)}</div></div>
    <div class="spacer"></div>
    <span class="chip gold"><span class="num">${p.coins}</span> ★</span>
  </div>`;
}
function render() {
  const app = $("#app");
  app.innerHTML = view === "pick" ? viewPick()
    : view === "home" ? topBar() + viewHome() + navBar()
    : view === "collect" ? topBar() + viewCollect() + navBar()
    : view === "shop" ? topBar() + viewShop() + navBar()
    : view === "events" ? topBar() + viewEvents() + navBar()
    : view === "room" ? topBar() + viewRoom() + navBar()
    : view === "auth" ? viewAuth()
    : view === "promote" ? viewPromote()
    : view === "backup" ? viewBackup()
    : view === "compare" ? topBar() + viewCompare() + navBar()
    : view === "parent" ? viewParent()
    : view === "battle" ? renderBattle()
    : view === "result" ? viewResult()
    : viewPick();
  wire();
}
function wire() {
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { SFX.tap(); go(b.dataset.nav, b.dataset.nav); });
  const NAVVIEWS = ["home", "collect", "shop", "events", "room"];
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    SFX.tap(); const v = b.dataset.go; go(v, NAVVIEWS.indexOf(v) >= 0 ? v : nav);
  });
  if (typeof wireScreen === "function") wireScreen();
}

/* --------------------------------------------------------------- seasons */
const SEASON_EPOCH = dayNum("2026-01-04");

  { key: "concert", name: "עונת הקונצרט", color: "#FF8FC7",
    glyphs: ["mic", "note", "star", "ribbon", "sparkle"],
    names: ["מיקרופון הבמה", "תו הזהב", "כוכב הקהל", "סרט ההופעה", "מיקרופון האור"] },

  { i: 4, rarity: "g", label: "800 נקודות ו-25 תרגילים ברמה 7 ומעלה", goal: 100,

function seasonNow() {

  return { idx, id: "s" + idx, theme: SEASONS[((idx % 4) + 4) % 4], daysLeft: SEASON_LEN - (((d % SEASON_LEN) + SEASON_LEN) % SEASON_LEN) };

function syncSeason(p) {
  const s = seasonNow();
  if (p.season && p.season.id === s.id) return;

    SEASON_REQS.forEach(r => {
      const has = p.collected.some(c => c.sid === p.season.id && c.i === r.i);
      if (!has) p.missed.push({ sid: p.season.id, i: r.i, name: old.names[r.i], glyph: old.glyphs[r.i], rarity: r.rarity });
    });
    if (p.missed.length > 40) p.missed = p.missed.slice(-40);

  p.season = { id: s.id, xp: 0, solved: 0, hi5: 0, hi7: 0, evWin: 0 };
}

/* ------------------------------------------------------- award checking */
function checkAwards(p) {
  const fresh = [];

  });

    if (r.val(p) >= r.goal) {
      const item = { sid: s.id, i: r.i, name: s.theme.names[r.i], glyph: s.theme.glyphs[r.i], rarity: r.rarity, season: s.theme.name, date: today() };
      p.collected.push(item);
      fresh.push({ kind: "season", name: item.name, glyph: item.glyph, rarity: item.rarity, req: "אוסף " + s.theme.name });
    }
  });
  if (fresh.length) persist();
  return fresh;
}

/* ------------------------------------------------------------- migration */
function upgrade(p) {
  /* forward-compatible: every new field is added, nothing existing is touched,
     so progress survives any future version of the app. */
  if (!p.grade) p.grade = 2;
  if (!Array.isArray(p.diplomas)) p.diplomas = [];
  if (!p.skills) p.skills = {};
  /* גרסאות ישנות שמרו לפי שם נושא — ממירים למשבצות */
  if (p.skills.add || p.skills.mul || p.skills.wrd) {
    p.skills = { t0: p.skills.add || { lv: 1 }, t1: p.skills.mul || { lv: 1 }, t2: p.skills.wrd || { lv: 1 } };
  }
  TOPIC_IDS.forEach(t => { if (!p.skills[t]) p.skills[t] = { lv: 1, fun: false, low: 0, bs: 0 }; });
  if (!Array.isArray(p.owned)) p.owned = ["luna", "cherry", "nana", "bg1", "fx_star"];
  if (!Array.isArray(p.log)) p.log = [];
  if (!Array.isArray(p.miss)) p.miss = [];
  if (!Array.isArray(p.trophies)) p.trophies = [];
  if (!p.events) p.events = {};
  if (typeof p.coins !== "number") p.coins = 0;
  if (typeof p.battles !== "number") p.battles = 0;
  if (typeof p.secs !== "number") p.secs = 0;
  if (p.xp === undefined) p.xp = p.coins || 0;
  if (!p.solved) p.solved = { total: 0, lv: {} };
  if (!p.solved.lv) p.solved.lv = {};
  if (p.bosses === undefined) p.bosses = 0;
  if (p.perfects === undefined) p.perfects = 0;
  if (p.bestCombo === undefined) p.bestCombo = 0;
  if (p.bestStreak === undefined) p.bestStreak = p.streak || 0;
  if (!p.badges) p.badges = {};
  if (!p.collected) p.collected = [];
  if (!p.missed) p.missed = [];
  if (!p.season) p.season = { id: null, xp: 0, solved: 0, hi5: 0, hi7: 0, evWin: 0 };
  if (!p.fx) { p.fx = "fx_star"; if (p.owned.indexOf("fx_star") < 0) p.owned.push("fx_star"); }
  if (!p.acc) { p.acc = "none"; if (p.owned.indexOf("acc_none") < 0) p.owned.push("acc_none"); }
  if (!p.sex) p.sex = "f";
  TOPIC_IDS.forEach(t => { if (!p.skills[t].bs) p.skills[t].bs = 0; });
  syncSeason(p);
}
S.profiles.forEach(p => { try { upgrade(p); } catch (e) {} });
persist();
</script>

<script>
let newp = null;      // {name, avatar} while creating a profile
let pinBuf = "";

/* ------------------------------------------------------------ profiles */
function viewPick() {
  if (newp) {
    return `<div class="pick">
      <div class="logo"><h1>${T("מי מצטרפת ללהקה?", "מי מצטרף ללהקה?")}</h1><p>${T("בחרי", "בחר")} שם ודמות — אפשר לשנות אחר כך</p></div>
      <div class="card">
        <label for="nm" style="font-size:13px;color:var(--dim)">איך קוראים לך?</label>
        <input id="nm" class="txt" style="margin-top:6px" maxlength="12" value="${esc(newp.name)}" placeholder="השם שלך">
        <div class="sec-title">בת או בן?</div>
        <div class="rowbtns">
          <button class="btn ${(newp.sex || "f") === "f" ? "pink" : "ghost"}" style="flex:1" data-newsex="f">בת</button>
          <button class="btn ${newp.sex === "m" ? "" : "ghost"}" style="flex:1" data-newsex="m">בן</button>
        </div>
        <div class="sec-title">${T("בחרי דמות", "בחר דמות")}</div>
        <div class="grid3">${SHOP.avatars.filter(a => a.cost === 0).map(a =>
          `<button class="item ${newp.avatar === a.id ? "eq" : ""}" data-av="${a.id}"><span class="avdisc">${mascot(a.id, 52)}</span><b>${MASCOTS[a.id].name}</b></button>`).join("")}</div>
        <div class="sec-title">${T("באיזו כיתה את?", "באיזו כיתה אתה?")}</div>
        ${gradePicker(newp.grade || 2, "data-newgrade")}
      </div>
      <button class="btn pink" id="mk">יאללה, מתחילים ✦</button>
      ${S.profiles.length ? '<button class="btn ghost" id="cancel">ביטול</button>' : ""}
    </div>`;
  }
  return `<div class="pick">
    <div class="logo"><h1>כוכבות החשבון</h1><p>תרגול שמתאים את עצמו אליך</p></div>
    ${S.profiles.map(p => `<button class="pcard" data-p="${p.id}">
        <span class="av" style="background:${SHOP.bgs.find(b => b.id === p.bg)?.css || "var(--raised)"}">${mascot(p.avatar, 54, p.acc)}</span>
        <span><h3>${esc(p.name)}</h3><span>${p.coins} ★ · ${streakTxt(p.streak)}</span></span>
      </button>`).join("")}
    <button class="btn ghost" id="add">+ הוספת שחקן/ית</button>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost" id="snd" style="flex:1">${S.sound ? "🔊 צליל דלוק" : "🔇 מושתק"}</button>
      <button class="btn ghost" id="par" style="flex:1">${ICONS.gear} מסך הורה</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- home */
function topicCard(id) {
  const p = P(), t = topicOf(p, id), sk = p.skills[id];
  sk.bs = sk.bs || 0;
  const boss = sk.bs >= 4;
  return `<div class="topic" style="color:${t.color}">
    <div class="glow" style="background:${t.color}"></div>
    <h3 style="color:var(--ink)">${t.name} <span style="color:${t.color};font-size:15px">${t.icon}</span></h3>
    <div class="sub">רמה ${sk.lv} מתוך 8 · ${t.levels[sk.lv - 1]}</div>
    ${sk.fun ? '<div class="tagfun">✦ מצב אימון כיף — מתאמנים עד שזה נכנס</div>' : ""}
    <div class="steps">${[...Array(8)].map((_, i) =>
      `<span class="step ${i + 1 < sk.lv ? "on" : i + 1 === sk.lv ? "now" : ""}"></span>`).join("")}</div>
    <div class="rowbtns">
      <button class="btn" style="flex:1" data-play="${id}">לתרגול</button>
      ${boss ? `<button class="btn gold" style="flex:1" data-boss="${id}">קרב בוס 👑</button>` : ""}
    </div>
  </div>`;
}
function viewHome() {
  const p = P(), ev = eventState(p), left = eventAttemptsLeft(ev.rec);
  const goal = Math.min(3, p.dayGoal || 0);
  let banner = "";
  if (ev.open && left > 0) {
    banner = `<button class="topic" style="color:var(--gold);width:100%;text-align:right;margin-bottom:12px" data-go="events">
      <div class="glow" style="background:var(--gold)"></div>
      <div style="display:flex;align-items:center;gap:12px;position:relative">
        ${trophyArt(ev.type.art, "gold", 46)}
        <div><h3 style="color:var(--ink);font-size:17px">${evTitle(ev.type, p)}</h3>
        <div class="sub">אירוע מיוחד פתוח · ${left === 2 ? "מועד א'" : "מועד ב'"} · נסגר בעוד ${ev.closesInDays} ימים</div></div>
      </div></button>`;
  }
  const place = p.placed ? "" : `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:12px">${mascot(p.avatar, 52, p.acc)}
      <div><h3 style="font-size:18px">נתחיל ממבחן מיקום?</h3>
      <div style="font-size:13px;color:var(--dim)">9 שאלות קצרות שימצאו בדיוק את הרמה שלך — במקום להתחיל מהתחלה</div></div></div>
      <div class="rowbtns" style="margin-top:12px">
        <button class="btn pink" style="flex:2" id="placebtn">קדימה</button>
        <button class="btn ghost" style="flex:1" id="skipplace">לא עכשיו</button></div>
    </div>`;
  return `${banner}${place}
    <div class="soft" style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div style="flex:1">
        <div style="font-family:var(--disp);font-size:15px">המשימה של היום</div>
        <div style="font-size:12.5px;color:var(--dim);margin-bottom:7px">3 קרבות — ${goal}/3</div>
        <div class="bar"><i style="width:${goal / 3 * 100}%;background:var(--mint)"></i></div>
      </div>
      <div class="mascot-wrap">${p.pet ? pet(p.pet, 46) : mascot(p.avatar, 46, p.acc)}</div>
    </div>
    ${seasonBanner(p, true)}
    <div style="height:14px"></div>
    <div class="list">${TOPIC_IDS.map(topicCard).join("")}</div>
    <div class="sec-title">הפרסים האחרונים שלי</div>
    ${recentPrizes(p)}
    <button class="btn ghost" style="margin-top:10px" data-go="collect">לאוסף המלא</button>`;
}

/* ---------------------------------------------------------- collection */
let collectTab = "season";

function prizeCard(o) {
  const r = RAR[o.rarity];
  const pct = o.got ? 100 : Math.max(0, Math.min(100, Math.round(o.cur / o.goal * 100)));
  const cls = o.got ? (o.rarity === "g" ? "prize got glowgot" : "prize got") : "prize";
  return `<div class="${cls}" style="${o.missed ? "opacity:.45" : ""}">
    ${badgeArt(o.glyph, o.rarity, 58, !o.got)}
    <b style="${o.got ? "color:" + r.txt : ""}">${esc(o.name)}</b>
    <span class="req">${o.missed ? "הוחמצה — העונה נגמרה" : esc(o.req)}</span>
    ${o.got || o.missed ? "" : `<div class="mini"><i style="width:${pct}%;background:${r.ring}"></i></div>
      <span class="req num" style="direction:ltr">${Math.min(o.cur, o.goal)} / ${o.goal}</span>`}
    <span class="rar" style="color:${r.txt}">${r.name}</span>
  </div>`;
}

function recentPrizes(p) {
  const got = [];
  p.collected.slice(-3).reverse().forEach(c => got.push({ name: c.name, glyph: c.glyph, rarity: c.rarity, req: c.season }));
  ACH.filter(a => p.badges[a.id]).slice(-6).reverse().forEach(a => got.push({ name: achTxt(a.name, p), glyph: a.glyph, rarity: a.rarity, req: achTxt(a.req, p) }));
  if (!got.length) {
    const next = ACH.find(a => !p.badges[a.id]);
    return `<div class="soft" style="display:flex;align-items:center;gap:12px">
      ${badgeArt(next.glyph, next.rarity, 50, true)}
      <div><b style="font-family:var(--disp);font-size:15px">${esc(achTxt(next.name, p))}</b>
      <div style="font-size:12.5px;color:var(--dim)">${esc(achTxt(next.req, p))}</div>
      <div class="mini" style="width:150px"><i style="width:${Math.min(100, next.val(p) / next.goal * 100)}%;background:${RAR[next.rarity].ring}"></i></div></div></div>`;
  }
  return `<div class="grid2">${got.slice(0, 2).map(o =>
    prizeCard({ ...o, cur: 1, goal: 1, got: true })).join("")}</div>`;
}
function seasonBanner(p, compact) {
  const s = seasonNow(), th = s.theme;
  const got = p.collected.filter(c => c.sid === s.id).length;
  return `<div class="seasonbar" ${compact ? 'data-go="collect" role="button" tabindex="0" style="width:100%;text-align:right;cursor:pointer"' : ""}>
    <div class="halo" style="background:${th.color}"></div>
    <div style="position:relative;display:flex;align-items:center;gap:12px">
      ${badgeArt(th.glyphs[4], "g", compact ? 44 : 58)}
      <div style="flex:1">
        <h3 style="font-size:${compact ? 17 : 20}px">${th.name}</h3>
        <div style="font-size:12.5px;color:var(--dim)">${got}/5 פרסי עונה · נשארו ${s.daysLeft} ימים</div>
        <div class="mini" style="margin-top:7px"><i style="width:${got / 5 * 100}%;background:${th.color}"></i></div>
      </div>
    </div>
    ${compact ? "" : `<p style="position:relative;font-size:13px;color:var(--dim);margin:12px 0 0">פרסי העונה זמינים רק עכשיו. כשהעונה נגמרת הם נעלמים ומגיעה עונה חדשה עם פרסים אחרים.</p>`}
  </div>`;
}

function viewCollect() {
  const p = P(), s = seasonNow();
  const stats = `<div class="rewardrow" style="flex-wrap:wrap">
      <div class="tile"><b class="num">${p.xp}</b><span>נקודות</span></div>
      <div class="tile"><b class="num">${p.solved.total}</b><span>תרגילים נכונים</span></div>
      <div class="tile"><b class="num">${Object.keys(p.badges).length}/${ACH.length}</b><span>הישגים</span></div>
    </div>`;
  let body;
  if (collectTab === "season") {
    body = seasonBanner(p) + `<div class="sec-title">פרסי ${s.theme.name}</div>
      <div class="grid2">${SEASON_REQS.map(r => {
        const got = p.collected.some(c => c.sid === s.id && c.i === r.i);
        return prizeCard({ name: s.theme.names[r.i], glyph: s.theme.glyphs[r.i], rarity: r.rarity, req: r.label, cur: r.val(p), goal: r.goal, got });
      }).join("")}</div>
      <div class="sec-title">אוספים קודמים</div>
      ${p.collected.filter(c => c.sid !== s.id).length
        ? `<div class="grid2">${p.collected.filter(c => c.sid !== s.id).map(c =>
            prizeCard({ name: c.name, glyph: c.glyph, rarity: c.rarity, req: c.season, cur: 1, goal: 1, got: true })).join("")}</div>`
        : `<div class="soft center" style="font-size:13.5px;color:var(--dim)">עוד אין פרסים מעונות קודמות</div>`}
      ${p.missed.length ? `<div class="sec-title">פספסנו (ולא יחזרו)</div>
        <div class="grid2">${p.missed.slice(-6).map(m =>
          prizeCard({ name: m.name, glyph: m.glyph, rarity: m.rarity, req: "", cur: 0, goal: 1, got: false, missed: true })).join("")}</div>` : ""}`;
  } else if (collectTab === "ach") {
    const fams = [...new Set(ACH.map(a => a.fam))];
    body = fams.map(f => `<div class="sec-title">${f}</div>
      <div class="grid2">${ACH.filter(a => a.fam === f).map(a =>
        prizeCard({ name: achTxt(a.name, p), glyph: a.glyph, rarity: a.rarity, req: achTxt(a.req, p), cur: a.val(p), goal: a.goal, got: !!p.badges[a.id] })).join("")}</div>`).join("");
  } else {
    body = `<div class="sec-title">פרסי אירועים</div>
      ${p.trophies.length ? `<div class="grid2">${p.trophies.map(t =>
        `<div class="prize got">${trophyArt(t.art, t.tier, 56)}<b>${TIER_TXT[t.tier]}</b><span class="req">${esc(t.title)}</span><span class="req">${t.date}</span></div>`).join("")}</div>`
        : `<div class="soft center" style="font-size:13.5px;color:var(--dim)">עוד אין פרסי אירועים</div>`}`;
  }
  return `<h2 style="font-size:22px;margin-bottom:4px">האוסף שלי</h2>${stats}
    <div class="tabs">
      <button data-tab="season" aria-selected="${collectTab === "season"}">אוסף העונה</button>
      <button data-tab="ach" aria-selected="${collectTab === "ach"}">הישגים</button>
      <button data-tab="ev" aria-selected="${collectTab === "ev"}">אירועים</button>
    </div>${body}`;
}

/* ---------------------------------------------------------------- shop */
let shopTab = "avatars";
const SHOP_TABS = [["avatars", "דמויות"], ["accs", "אביזרים"], ["pets", "חיות"], ["bgs", "רקעים"], ["fx", "אפקטים"]];

function buy(kind, id, cost) {
  const p = P();
  if (p.owned.indexOf(id) >= 0) return equip(kind, id);
  const o = SHOP[kind].find(x => x.id === id);
  if (o && o.need && !needMet(p, o.need)) { SFX.soft(); return toast(needText(o.need)); }
  if (p.coins < cost) { SFX.soft(); return toast("חסרים " + (cost - p.coins) + " כוכבים ★"); }
  p.coins -= cost; p.owned.push(id); SFX.win(); confetti(26); toast("נפתח! ✦");
  equip(kind, id);
}
function equip(kind, id) {
  const p = P();
  if (kind === "avatars") p.avatar = id;
  if (kind === "pets") p.pet = (p.pet === id ? null : id);
  if (kind === "bgs") p.bg = id;
  if (kind === "fx") { p.fx = id; playFX(id, "לדוגמה!"); }
  if (kind === "accs") p.acc = (ACCBY[id] || {}).key || "none";
  SFX.tap(); persist(); render();
}
function shopCell(kind, o, art, label) {
  const p = P();
  const own = p.owned.indexOf(o.id) >= 0;
  const eq = (kind === "avatars" && p.avatar === o.id) || (kind === "pets" && p.pet === o.id)
          || (kind === "bgs" && p.bg === o.id) || (kind === "fx" && p.fx === o.id)
          || (kind === "accs" && p.acc === o.key);
  const gated = !own && o.need && !needMet(p, o.need);
  const poor = !own && !gated && p.coins < o.cost;
  const cls = "item" + (own ? " own" : "") + (eq ? " eq" : "") + (gated || poor ? " locked" : "");
  let foot;
  if (eq) foot = '<span style="color:var(--gold)">פעיל</span>';
  else if (own) foot = "<span>לבחירה</span>";
  else if (gated) foot = `<span style="color:var(--cyan)">🔒 ${esc(needText(o.need))}</span>
    <span class="num" style="direction:ltr">${needVal(p, o.need.k)} / ${o.need.n}</span>`;
  else foot = `<span class="num" style="direction:ltr">${o.cost} ★</span>`;
  return `<button class="${cls}" data-buy="${kind}|${o.id}|${o.cost}">${art}<b>${esc(label)}</b>${foot}</button>`;
}
function viewShop() {
  const p = P();
  let body;
  if (shopTab === "avatars") {
    body = `<div class="grid2">${SHOP.avatars.map(o =>
      shopCell("avatars", o, `<span class="avdisc">${mascot(o.id, 62, p.acc)}</span>`, MASCOTS[o.id].name)).join("")}</div>`;
  } else if (shopTab === "accs") {
    body = `<div class="grid2">${SHOP.accs.map(o =>
      shopCell("accs", o, `<span class="avdisc">${mascot(p.avatar, 62, o.key)}</span>`, o.name)).join("")}</div>`;
  } else if (shopTab === "pets") {
    body = `<div class="grid2">${SHOP.pets.map(o =>
      shopCell("pets", o, pet(o.id, 60), o.name)).join("")}</div>`;
  } else if (shopTab === "bgs") {
    body = `<div class="grid2">${SHOP.bgs.map(o =>
      shopCell("bgs", o, `<span style="display:block;height:52px;border-radius:12px;background:${o.css}"></span>`, o.name)).join("")}</div>`;
  } else {
    body = `<div class="grid2">${SHOP.fx.map(o =>
      shopCell("fx", o, `<span class="fxprev" style="color:${o.c}">${o.g}<i>${o.g}</i><i>${o.g}</i></span>
        <span class="fxword-mini" style="color:${o.c}">${esc(o.w[0])}</span>`, o.name)).join("")}</div>
      <div class="soft" style="font-size:13.5px;color:var(--dim);margin-top:12px">
        האפקט שנבחר מופיע אחרי כל תשובה נכונה, עם המילה שלו. לחיצה על אפקט שכבר יש לך מציגה אותו.</div>`;
  }
  const hint = { avatars: "הדמויות היקרות נפתחות רק אחרי הרבה תרגול", accs: "האביזר נשאר על הדמות שלך בכל מסך",
                 pets: "חיית לוויה מלווה אותך במסך הבית",
                 bgs: "הרקע משנה את החדר שלך ואת מסך הבחירה", fx: "אפקט לכל תשובה נכונה" }[shopTab];
  return `<h2 style="font-size:22px;margin-bottom:4px">חנות הכוכבות</h2>
    <div style="font-size:13px;color:var(--dim);margin-bottom:2px">${hint}. פרסי אירועים ועונות לא נמכרים כאן לעולם.</div>
    <div class="tabs">${SHOP_TABS.map(([k, l]) =>
      `<button data-stab="${k}" aria-selected="${shopTab === k}">${l}</button>`).join("")}</div>
    ${body}`;
}

/* -------------------------------------------------------------- events */
function viewEvents() {
  const p = P(), ev = eventState(p), left = eventAttemptsLeft(ev.rec), rec = ev.rec;
  let body;
  if (!ev.open) {
    body = `<div class="card center">
      <div class="mascot-wrap">${trophyArt(ev.type.art, "silver", 74)}</div>
      <h3 style="font-size:20px">האירוע הבא בעוד ${ev.nextInDays} ימים</h3>
      <p style="color:var(--dim);font-size:14px">${evTitle(ev.type, p)} · ${evBlurb(ev.type, p)}</p>
      <p style="font-size:14px">עד אז — כל רמה שתעלי בתרגול הרגיל מגדילה את הפרס שאפשר לזכות בו.</p>
      <button class="btn" data-go="home" style="margin-top:10px">לתרגול</button>
    </div>`;
  } else if (left === 0) {
    body = `<div class="card center">
      <div class="mascot-wrap">${mascot(p.avatar, 74, p.acc)}</div>

<script>
/* ================================================= backup & comparison */
const SAVE_VERSION = 3;

/* Saving a file: inside the Claude viewer this goes through the page's
   downloads capability; on a plain web host the blob fallback is used. */
let DL = null;
try {
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
  }
} catch (e) {}
function saveTextFile(name, text, done) {
  if (DL && DL.save) {
    DL.save({ filename: name, data: text })
      .then(() => done("הקובץ נשמר ✦"))
      .catch(() => done("השמירה בוטלה — אפשר להעתיק את הקוד במקום"));
    return;
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    done("אם ההורדה לא התחילה — העתיקו את הקוד במקום");
  } catch (e) { done("ההורדה חסומה כאן — העתיקו את הקוד"); }
}

function b64e(str) {
  const b = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
  return btoa(bin);
}
function b64d(s) {
  const bin = atob(s), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}

/* ---- full backup: every profile, everything, restorable anywhere ---- */
function backupCode() {
  const slim = JSON.parse(JSON.stringify({ v: SAVE_VERSION, pin: S.pin, profiles: S.profiles, rivals: S.rivals || [] }));
  slim.profiles.forEach(p => { p.log = (p.log || []).slice(-150); });
  return "KOCHAVOT-" + b64e(JSON.stringify(slim));
}
function restoreCode(code) {
  code = (code || "").trim().replace(/\s+/g, "");
  if (code.indexOf("KOCHAVOT-") !== 0) return { err: "הקוד לא נראה נכון — הוא צריך להתחיל ב-KOCHAVOT-" };
  let data;
  try { data = JSON.parse(b64d(code.slice(9))); } catch (e) { return { err: "הקוד פגום או חסר בסופו" }; }
  if (!data || !Array.isArray(data.profiles)) return { err: "לא נמצאו פרופילים בקוד" };
  let added = 0, merged = 0;
  data.profiles.forEach(np => {
    try { upgrade(np); } catch (e) {}
    const i = S.profiles.findIndex(x => x.id === np.id);
    if (i >= 0) { S.profiles[i] = np; merged++; } else { S.profiles.push(np); added++; }
  });
  if (data.pin && !S.pin) S.pin = data.pin;
  if (Array.isArray(data.rivals)) {
    S.rivals = S.rivals || [];
    data.rivals.forEach(r => { if (!S.rivals.some(x => x.n === r.n)) S.rivals.push(r); });
  }
  persist();
  return { added, merged };
}

/* ---- friend code: a small read-only snapshot for comparing ---- */
function snapshot(p) {
  return {
    v: 1, n: p.name, av: p.avatar, ac: p.acc || "none", d: today(),
    xp: p.xp || 0, sv: p.solved.total || 0,
    h5: solvedAtLeast(p, 5), h7: solvedAtLeast(p, 7),
    lv: SLOTS.map(t => p.skills[t].lv), gr: p.grade || 2,
    dp: (p.diplomas || []).map(d => d.grade),
    st: p.bestStreak || 0, bs: p.bosses || 0, pf: p.perfects || 0, cb: p.bestCombo || 0,
    bd: Object.keys(p.badges || {}), cl: (p.collected || []).map(c => c.name),
    tr: (p.trophies || []).map(t => t.tier), ow: p.owned || []
  };
}
const friendCode = p => "KOCHAVOT-FRIEND-" + b64e(JSON.stringify(snapshot(p)));
function parseFriend(code) {
  code = (code || "").trim().replace(/\s+/g, "");
  if (code.indexOf("KOCHAVOT-FRIEND-") !== 0) return { err: "זה לא קוד חברה — הוא צריך להתחיל ב-KOCHAVOT-FRIEND-" };
  try {
    const o = JSON.parse(b64d(code.slice(16)));
    if (!o || !o.n) return { err: "הקוד פגום" };
    return { snap: o };
  } catch (e) { return { err: "הקוד פגום או חסר בסופו" }; }
}

const ALL_SHOP = () => SHOP.avatars.concat(SHOP.pets, SHOP.bgs, SHOP.fx);
function shopName(id) {
  const o = ALL_SHOP().find(x => x.id === id);
  if (!o) return id;
  return o.name || (MASCOTS[id] ? MASCOTS[id].name : id);
}

/* --------------------------------------------------------- backup view */
function viewBackup() {
  const code = backupCode();
  return `<div style="padding-block:18px 24px">

      הקוד למטה הוא גיבוי מלא של כל הפרופילים — שמרו אותו אם מחליפים מכשיר, מנקים את הדפדפן,

    <p style="color:var(--dim);font-size:12.5px">
      שחזור מוסיף פרופילים שאינם על המכשיר, ומעדכן פרופיל קיים לגרסה שבקוד. שום הישג לא נמחק בדרך.</p>
    <button class="btn ghost" style="margin-top:14px" data-go="room">חזרה</button>

/* -------------------------------------------------------- compare view */
let cmpTab = "local", cmpOther = null;   // cmpOther: profile id, or "r:<index>"

function sideOf(key) {
  if (!key) return null;
  if (key.indexOf("r:") === 0) return (S.rivals || [])[Number(key.slice(2))] || null;
  const p = S.profiles.find(x => x.id === key);
  return p ? snapshot(p) : null;
}
function cmpRow(label, a, b, better) {
  const max = Math.max(a, b, 1);
  const aw = Math.round(a / max * 100), bw = Math.round(b / max * 100);
  const lead = a === b ? "" : (a > b) === (better !== false) ? "a" : "b";
  return `<div class="cmp">
    <div class="cmp-l">${esc(label)}</div>
    <div class="cmp-bars">
      <div class="cmp-side"><span class="num ${lead === "a" ? "win" : ""}">${a}</span><div class="mini"><i style="width:${aw}%;background:var(--cyan)"></i></div></div>
      <div class="cmp-side"><span class="num ${lead === "b" ? "win" : ""}">${b}</span><div class="mini"><i style="width:${bw}%;background:var(--pink)"></i></div></div>
    </div>
  </div>`;
}
function viewCompare() {
  const p = P(), me = snapshot(p);
  const others = S.profiles.filter(x => x.id !== p.id).map(x => ({ key: x.id, name: x.name }))
    .concat((S.rivals || []).map((r, i) => ({ key: "r:" + i, name: r.n + " (קוד)" })));
  if (!cmpOther || !sideOf(cmpOther)) cmpOther = others.length ? others[0].key : null;
  const you = me, her = sideOf(cmpOther);

  const codeBox = `<div class="sec-title">הקוד שלי להשוואה</div>
    <textarea id="frcode" class="txt sel" rows="3" readonly>${esc(friendCode(p))}</textarea>
    <div class="rowbtns" style="margin-top:8px">
      <button class="btn" style="flex:1" id="frcopy">העתקת הקוד שלי</button>
    </div>
    <div class="sec-title">הוספת חברה מקוד</div>
    <textarea id="fradd" class="txt sel" rows="3" placeholder="הדביקו כאן קוד חברה"></textarea>
    <button class="btn pink" style="margin-top:8px" id="fradd-go">הוספה להשוואה</button>`;

  if (!her) {
    return `<h2 style="font-size:22px;margin-bottom:4px">השוואה</h2>
      <p style="color:var(--dim);font-size:13.5px">אפשר להשוות בין שתי כוכבות על אותו מכשיר,
      או להדביק קוד של חברה ממכשיר אחר.</p>${codeBox}
      <button class="btn ghost" style="margin-top:14px" data-go="room">חזרה</button>`;
  }

  const badgeMap = {};
  ACH.forEach(a => badgeMap[a.id] = a);
  const sheHas = her.bd.filter(id => you.bd.indexOf(id) < 0).map(id => badgeMap[id]).filter(Boolean);
  const youHave = you.bd.filter(id => her.bd.indexOf(id) < 0).map(id => badgeMap[id]).filter(Boolean);
  const sheShop = her.ow.filter(id => you.ow.indexOf(id) < 0);
  const youShop = you.ow.filter(id => her.ow.indexOf(id) < 0);
  const gold = s => s.tr.filter(t => t === "gold").length;

  const strengths = [];
  if (you.xp > her.xp) strengths.push([you.n, "נקודות"]); else if (her.xp > you.xp) strengths.push([her.n, "נקודות"]);
  if (you.h7 > her.h7) strengths.push([you.n, "תרגילים ברמות הגבוהות"]); else if (her.h7 > you.h7) strengths.push([her.n, "תרגילים ברמות הגבוהות"]);
  if (you.st > her.st) strengths.push([you.n, "רצף ימים"]); else if (her.st > you.st) strengths.push([her.n, "רצף ימים"]);
